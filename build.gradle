plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.4'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion.set(minecraft_version)
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.cleanroommc.com' }
}

dependencies {
    def mixin = "zone.rong:mixinbooter:\${mixin_booter_version}"

    implementation(mixin) {
        transitive = false
    }
    annotationProcessor mixin
    modUtils.enableMixins(mixin)

    implementation(modUtils.deobfuscate('curse.maven:actually-additions-228404:3117927').toString())
}

processResources {
    inputs.property 'version', project.version

    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = "\${archives_base_name}-\${project.version}.jar"
    manifest {
        attributes(
                'MixinConfigs': 'mixins.actuallyadditionsfixes.json'
        )
    }
}
