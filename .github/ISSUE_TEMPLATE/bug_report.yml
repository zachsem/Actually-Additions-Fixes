name: Bug report
description: Report a problem with Actually Additions Fixes
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.12.2"
    validations:
      required: true
  - type: input
    id: forge
    attributes:
      label: Forge version
    validations:
      required: true
  - type: input
    id: aa
    attributes:
      label: Actually Additions version
      placeholder: "r152"
    validations:
      required: true
  - type: input
    id: fix
    attributes:
      label: Actually Additions Fixes version
    validations:
      required: true
  - type: input
    id: mixinbooter
    attributes:
      label: MixinBooter version
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Single-player / integrated server
        - Dedicated server
        - Both
    validations:
      required: true
  - type: textarea
    id: other_mods
    attributes:
      label: Other relevant mods
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Attach latest.log or the relevant crash report.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for the same problem.
          required: true
